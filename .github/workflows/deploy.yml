name: CI/CD for Strapi

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: strapi
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: yarn install

      - name: Build Strapi app
        run: yarn build

      #- name: Run Strapi tests (optional)
      #  run: yarn test --if-present

      #- name: Start Strapi in development mode (for test)
      #  run: |
      #    yarn develop &
      #    sleep 10
      #    curl --fail http://localhost:1337 || exit 1

      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/falmnw/strapi  
            git pull origin develop
            docker compose -f docker-compose.dev.yml down
            docker compose -f docker-compose.dev.yml up -d --build
